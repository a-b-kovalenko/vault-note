spring:
  profiles:
    group:
      local-supabase:
        - local
  servlet:
    multipart:
      max-file-size: ${VAULTNOTE_AVATAR_MAX_UPLOAD_SIZE:2MB}
      max-request-size: ${VAULTNOTE_AVATAR_MAX_REQUEST_SIZE:3MB}
  mail:
    host: ${VAULTNOTE_MAIL_HOST:localhost}
    port: ${VAULTNOTE_MAIL_PORT:1025}
    username: ${VAULTNOTE_MAIL_USERNAME:}
    password: ${VAULTNOTE_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${VAULTNOTE_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${VAULTNOTE_MAIL_SMTP_STARTTLS:false}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: vaultnote
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: vaultnote

app:
  avatar:
    max-upload-size: ${VAULTNOTE_AVATAR_MAX_UPLOAD_SIZE:2MB}
    min-input-dimension: ${VAULTNOTE_AVATAR_MIN_INPUT_DIMENSION:64}
    max-input-width: ${VAULTNOTE_AVATAR_MAX_INPUT_WIDTH:2048}
    max-input-height: ${VAULTNOTE_AVATAR_MAX_INPUT_HEIGHT:2048}
    max-input-pixels: ${VAULTNOTE_AVATAR_MAX_INPUT_PIXELS:4194304}
    output-size: ${VAULTNOTE_AVATAR_OUTPUT_SIZE:256}
    jpeg-quality: ${VAULTNOTE_AVATAR_JPEG_QUALITY:0.85}
  cors:
    allowed-origins: ${VAULTNOTE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    csrf:
      token-ttl: ${VAULTNOTE_CSRF_TOKEN_TTL:PT5M}
    rate-limit:
      enabled: ${VAULTNOTE_RATE_LIMIT_ENABLED:true}
      max-entries: ${VAULTNOTE_RATE_LIMIT_MAX_ENTRIES:10000}
      login:
        ip-limit: ${VAULTNOTE_RATE_LIMIT_LOGIN_IP_LIMIT:100}
        email-limit: ${VAULTNOTE_RATE_LIMIT_LOGIN_EMAIL_LIMIT:20}
        window: ${VAULTNOTE_RATE_LIMIT_LOGIN_WINDOW:PT15M}
      registration:
        ip-limit: ${VAULTNOTE_RATE_LIMIT_REGISTRATION_IP_LIMIT:10}
        email-limit: ${VAULTNOTE_RATE_LIMIT_REGISTRATION_EMAIL_LIMIT:3}
        window: ${VAULTNOTE_RATE_LIMIT_REGISTRATION_WINDOW:PT1H}
      password-reset:
        ip-limit: ${VAULTNOTE_RATE_LIMIT_PASSWORD_RESET_IP_LIMIT:20}
        email-limit: ${VAULTNOTE_RATE_LIMIT_PASSWORD_RESET_EMAIL_LIMIT:3}
        window: ${VAULTNOTE_RATE_LIMIT_PASSWORD_RESET_WINDOW:PT1H}
  mail:
    from: ${VAULTNOTE_MAIL_FROM:no-reply@vaultnote.local}
  oauth2:
    frontend-base-url: ${VAULTNOTE_OAUTH2_FRONTEND_BASE_URL:http://localhost:4200}
    google-avatar:
      connect-timeout: ${VAULTNOTE_OAUTH2_GOOGLE_AVATAR_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${VAULTNOTE_OAUTH2_GOOGLE_AVATAR_REQUEST_TIMEOUT:PT5S}
      max-download-size: ${VAULTNOTE_OAUTH2_GOOGLE_AVATAR_MAX_DOWNLOAD_SIZE:2MB}
      allowed-hosts: ${VAULTNOTE_OAUTH2_GOOGLE_AVATAR_ALLOWED_HOSTS:lh3.googleusercontent.com,lh4.googleusercontent.com,lh5.googleusercontent.com,lh6.googleusercontent.com}
    authorization-request-cookie:
      cookie-name: ${VAULTNOTE_OAUTH2_AUTHORIZATION_REQUEST_COOKIE_NAME:vaultnote_oauth2_authorization_request}
      max-age: ${VAULTNOTE_OAUTH2_AUTHORIZATION_REQUEST_COOKIE_MAX_AGE:PT5M}
      secure: ${VAULTNOTE_OAUTH2_AUTHORIZATION_REQUEST_COOKIE_SECURE:false}
  email-verification:
    base-url: ${VAULTNOTE_EMAIL_VERIFICATION_BASE_URL:http://localhost:4200}
    token-ttl: ${VAULTNOTE_EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
  password-reset:
    base-url: ${VAULTNOTE_PASSWORD_RESET_BASE_URL:http://localhost:4200}
    token-ttl: ${VAULTNOTE_PASSWORD_RESET_TOKEN_TTL:PT1H}
  jwt:
    issuer: ${VAULTNOTE_JWT_ISSUER:vaultnote}
    secret: ${VAULTNOTE_JWT_SECRET}
    access-token-ttl: ${VAULTNOTE_JWT_ACCESS_TOKEN_TTL:PT15M}
  refresh-token:
    ttl: ${VAULTNOTE_REFRESH_TOKEN_TTL:P7D}
    cookie-name: ${VAULTNOTE_REFRESH_TOKEN_COOKIE_NAME:vaultnote_refresh_token}
    cookie-path: ${VAULTNOTE_REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
    secure: ${VAULTNOTE_REFRESH_TOKEN_COOKIE_SECURE:false}
    same-site: ${VAULTNOTE_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

management:
  health:
    mail:
      enabled: false

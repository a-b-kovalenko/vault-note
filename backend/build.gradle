import com.github.gradle.node.npm.task.NpmTask
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.github.node-gradle.node' version '7.1.0'
  id 'com.diffplug.spotless' version '8.9.0'
  id 'jacoco'
  id 'idea'
  id 'java'
}

group = 'com.andrii'
version = '0.1.0-SNAPSHOT'
description = 'VaultNote Spring Boot application.'

def docsProjectDir = rootProject.file('../docs')
def docsSiteDir = new File(docsProjectDir, 'build/site')
def frontendProjectDir = rootProject.file('../frontend')
def frontendDistDir = new File(frontendProjectDir, 'dist/frontend')
def docsNodeVersion = '22.22.3'

node {
  version = docsNodeVersion
  download = true
  nodeProjectDir = docsProjectDir
  workDir = file('.gradle/nodejs')
  npmWorkDir = file('.gradle/npm')
}

repositories {
  mavenCentral()
}

ext {
  lombokVersion = '1.18.46'
  lombokMapstructBindingVersion = '0.2.0'
  mapstructVersion = '1.6.3'
  springdocVersion = '3.1.0'
  bouncycastleVersion = '1.84'
  restAssuredVersion = '6.0.0'
  databaseRiderVersion = '1.44.0'

  jacocoExclusions = [
      '**/*Application.class',
      '**/*Configuration.class',
      '**/*Controller.class',
      '**/config/**',
      '**/dto/**',
      '**/entity/**',
      '**/exception/**',
      '**/mapper/**',
      '**/generated/**'
  ]
}

dependencies {
  implementation platform(SpringBootPlugin.BOM_COORDINATES)

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-liquibase'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"

  implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
  implementation "org.mapstruct:mapstruct:${mapstructVersion}"

  runtimeOnly 'org.postgresql:postgresql'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
  testImplementation "com.github.database-rider:rider-spring:${databaseRiderVersion}"

  compileOnly "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
  annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
  annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"

  testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

sourceSets {
  integrationTest {
    java.srcDir 'src/integrationTest/java'
    resources.srcDir 'src/integrationTest/resources'
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

idea {
  module {
    testSources.from(sourceSets.integrationTest.java.srcDirs)
    testResources.from(sourceSets.integrationTest.resources.srcDirs)
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
  integrationTestCompileOnly.extendsFrom testCompileOnly
  integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.named('processIntegrationTestResources') {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('integrationTest', Test) {
  description = 'Runs JPA integration tests with Testcontainers.'
  group = 'verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  shouldRunAfter tasks.named('test')
  useJUnitPlatform()
}

tasks.register('antoraInstall', NpmTask) {
  description = 'Installs the pinned Antora documentation dependencies.'
  group = 'documentation'
  workingDir = docsProjectDir
  args = ['ci']
  inputs.files(
      new File(docsProjectDir, 'package.json'),
      new File(docsProjectDir, 'package-lock.json'))
  outputs.dir(new File(docsProjectDir, 'node_modules'))
}

tasks.register('antoraBuild', NpmTask) {
  description = 'Builds the Antora documentation site.'
  group = 'documentation'
  dependsOn tasks.named('antoraInstall')
  workingDir = docsProjectDir
  args = ['run', 'build']
  inputs.files(fileTree(docsProjectDir) {
    include 'antora.yml'
    include 'antora-playbook.yml'
    include 'modules/**'
  })
  outputs.dir(docsSiteDir)
}

tasks.register('frontendNpmInstall', NpmTask) {
  description = 'Installs the pinned Angular frontend dependencies.'
  group = 'frontend'
  workingDir = frontendProjectDir
  args = ['ci']
  inputs.files(
      new File(frontendProjectDir, 'package.json'),
      new File(frontendProjectDir, 'package-lock.json'))
  outputs.dir(new File(frontendProjectDir, 'node_modules'))
}

tasks.register('frontendStart', NpmTask) {
  description = 'Starts the Angular frontend development server.'
  group = 'frontend'
  dependsOn tasks.named('frontendNpmInstall')
  workingDir = frontendProjectDir
  args = ['run', 'start']
}

tasks.register('frontendTest', NpmTask) {
  description = 'Runs Angular frontend unit tests once.'
  group = 'verification'
  dependsOn tasks.named('frontendNpmInstall')
  workingDir = frontendProjectDir
  args = ['run', 'test', '--', '--watch=false']
  inputs.files(
      new File(frontendProjectDir, 'angular.json'),
      new File(frontendProjectDir, 'package.json'),
      new File(frontendProjectDir, 'package-lock.json'),
      new File(frontendProjectDir, 'tsconfig.json'),
      new File(frontendProjectDir, 'tsconfig.app.json'),
      new File(frontendProjectDir, 'tsconfig.spec.json'))
  inputs.dir(new File(frontendProjectDir, 'src'))
}

tasks.register('frontendBuild', NpmTask) {
  description = 'Builds the Angular frontend for production.'
  group = 'build'
  dependsOn tasks.named('frontendNpmInstall')
  workingDir = frontendProjectDir
  args = ['run', 'build', '--', '--no-progress']
  inputs.files(
      new File(frontendProjectDir, 'angular.json'),
      new File(frontendProjectDir, 'package.json'),
      new File(frontendProjectDir, 'package-lock.json'),
      new File(frontendProjectDir, 'tsconfig.json'),
      new File(frontendProjectDir, 'tsconfig.app.json'))
  inputs.dir(new File(frontendProjectDir, 'public'))
  inputs.dir(new File(frontendProjectDir, 'src'))
  outputs.dir(frontendDistDir)
}

spotless {
  java {
    target 'src/*/java/**/*.java'
    eclipse().configFile(file('config/formatter/eclipse-java-formatter.xml'))
    removeUnusedImports()
    forbidWildcardImports()
  }
}

tasks.named('jacocoTestReport') {
  executionData.setFrom(tasks.named('test').map { it.extensions.jacoco.destinationFile })
  classDirectories.setFrom(files(classDirectories.files.collect { directory ->
    fileTree(dir: directory, exclude: jacocoExclusions)
  }))
}

tasks.named('jacocoTestCoverageVerification') {
  executionData.setFrom(tasks.named('test').map { it.extensions.jacoco.destinationFile })
  classDirectories.setFrom(files(classDirectories.files.collect { directory ->
    fileTree(dir: directory, exclude: jacocoExclusions)
  }))

  violationRules {
    rule {
      limit {
        minimum = 0.80
      }
    }
  }
}

tasks.named('check') {
  group = 'verification'
  description = 'Runs the required verification tasks for the backend and frontend.'
  dependsOn tasks.named('spotlessCheck')
  dependsOn tasks.named('integrationTest')
  dependsOn tasks.named('jacocoTestReport')
  dependsOn tasks.named('jacocoTestCoverageVerification')
  dependsOn tasks.named('antoraBuild')
  dependsOn tasks.named('frontendTest')
  dependsOn tasks.named('frontendBuild')
}

tasks.named('clean') {
  delete docsSiteDir
  delete frontendDistDir
}

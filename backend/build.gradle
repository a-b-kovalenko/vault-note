buildscript {
    repositories {
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.9.0'
    }
}

plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.andrii'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/*/java/**/*.java'
            palantirJavaFormat('2.92.0')
            removeUnusedImports()
            forbidWildcardImports()
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    plugins.withId('java') {
        tasks.named('check') {
            dependsOn(tasks.named('spotlessCheck'))
            dependsOn(tasks.named('jacocoTestCoverageVerification'))
        }
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn(tasks.named('test'))
        onlyIf {
            file('src/main/java').exists()
        }
        classDirectories.setFrom(files(classDirectories.files.collect { directory ->
            fileTree(dir: directory, exclude: ['**/*Application.class'])
        }))

        violationRules {
            rule {
                limit {
                    minimum = 0.80
                }
            }
        }
    }
}

tasks.named('check') {
    group = 'verification'
    description = 'Runs the required verification tasks for every backend module.'
    dependsOn(tasks.named('spotlessCheck'))
    dependsOn(subprojects.collect { it.tasks.named('check') })
}

plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.9.0' apply false
}

ext {
    lombokVersion = '1.18.46'
    lombokMapstructBindingVersion = '0.2.0'
    mapstructVersion = '1.6.3'
    springdocVersion = '3.1.0'

    jacocoExclusions = [
        '**/*Application.class',
        '**/*Configuration.class',
        '**/*Controller.class',
        '**/config/**',
        '**/dto/**',
        '**/entity/**',
        '**/exception/**',
        '**/mapper/**',
        '**/generated/**'
    ]
}

allprojects {
    group = 'com.andrii'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            target 'src/*/java/**/*.java'
            eclipse().configFile(rootProject.file('config/formatter/eclipse-java-formatter.xml'))
            removeUnusedImports()
            forbidWildcardImports()
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    dependencies {
        implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    plugins.withId('java') {
        tasks.named('check') {
            dependsOn(tasks.named('spotlessCheck'))
            dependsOn(tasks.named('jacocoTestReport'))
            dependsOn(tasks.named('jacocoTestCoverageVerification'))
        }
    }

    tasks.named('jacocoTestReport') {
        onlyIf {
            file('src/main/java').exists()
        }
        executionData.setFrom(tasks.named('test').map { it.extensions.jacoco.destinationFile })
        classDirectories.setFrom(files(classDirectories.files.collect { directory ->
            fileTree(dir: directory, exclude: jacocoExclusions)
        }))
    }

    tasks.named('jacocoTestCoverageVerification') {
        dependsOn(tasks.named('test'))
        onlyIf {
            file('src/main/java').exists()
        }
        executionData.setFrom(tasks.named('test').map { it.extensions.jacoco.destinationFile })
        classDirectories.setFrom(files(classDirectories.files.collect { directory ->
            fileTree(dir: directory, exclude: jacocoExclusions)
        }))

        violationRules {
            rule {
                limit {
                    minimum = 0.80
                }
            }
        }
    }
}

tasks.named('check') {
    group = 'verification'
    description = 'Runs the required verification tasks for every backend module.'
    dependsOn(tasks.named('spotlessCheck'))
    dependsOn(subprojects.collect { it.tasks.named('check') })
}

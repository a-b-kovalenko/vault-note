<main class="me-page">
  <section class="me-card" aria-labelledby="me-title">
    <p class="eyebrow">Authenticated session</p>
    <div class="me-heading">
      <h1 id="me-title">Me</h1>
      <button
        class="logout-button"
        type="button"
        [disabled]="isLoggingOut()"
        (click)="onLogout()"
      >
        {{ isLoggingOut() ? 'Logging out…' : 'Log out' }}
      </button>
    </div>

    @if (isLoading()) {
      <p class="status-message" role="status">Loading your profile…</p>
    } @else if (loadError(); as errorMessage) {
      <p class="status-message status-message-error" role="alert">{{ errorMessage }}</p>
    } @else if (currentUser(); as user) {
      <dl class="user-details">
        <div>
          <dt>User ID</dt>
          <dd>{{ user.userId }}</dd>
        </div>
        <div>
          <dt>Roles</dt>
          <dd>
            <ul class="role-list">
              @for (role of user.roles; track role) {
                <li>{{ role }}</li>
              }
            </ul>
          </dd>
        </div>
      </dl>
    }
  </section>
</main>

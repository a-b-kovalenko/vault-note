name: Deploy frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: vaultnote-505715
  WIF_PROVIDER: projects/835573267393/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SERVICE_ACCOUNT: vaultnote-github-deployer@vaultnote-505715.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.27.0

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
